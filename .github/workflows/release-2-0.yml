name: Publish Windows 2.0 STABLE

on:
  push:
    branches: [main]
    paths:
      - 's3mapgen/version.py'
      - '.github/workflows/release-2-0.yml'
      - 'tools/publish_release_2_0.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-2.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r build/windows/requirements-runtime.txt -r build/windows/requirements-build.txt pytest
      - name: Confirm final release source
        run: python -c "from s3mapgen.version import APP_VERSION; assert APP_VERSION == '2.0 STABLE'"
      - name: Protected baseline hashes
        shell: powershell
        run: .\build\windows\verify_protected_hashes.ps1
      - name: Tcl runtime diagnostics
        run: >-
          python -c "import sys, tkinter as tk; t=tk.Tcl();
          print(sys.executable); print(t.eval('info library')); print(t.eval('info patchlevel'))"
      - name: Custom editor Tcl tests (isolated process)
        run: python -m pytest -q tests/test_custom_ui_updates.py
      - name: Prepare desktop for Tk tests
        run: python tools/prepare_windows_test_desktop.py
      - name: Desktop startup Tk test (isolated process)
        run: python -m pytest -q tests/application/shell/test_desktop_startup.py
      - name: Message-window Tk tests (isolated process)
        run: python -m pytest -q tests/application/test_messages.py
      - name: Configurations Tk test (isolated process)
        run: python -m pytest -q tests/application/shell/test_configurations_ui.py
      - name: Regression tests
        run: >-
          python -m pytest -q
          --ignore=tests/test_custom_ui_updates.py
          --ignore=tests/application/shell/test_desktop_startup.py
          --ignore=tests/application/test_messages.py
          --ignore=tests/application/shell/test_configurations_ui.py
      - name: Engine smoke validation
        run: python tests/run_smoke.py
      - name: Build and validate standalone folder
        shell: powershell
        run: .\build\windows\build_windows.ps1
      - name: Publish qualified 2.0 and remove obsolete rc
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_release_2_0.py --publish
      - name: Preserve release qualification and publication records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Settlers3MapGen-2.0-release-records
          path: artifacts/*
          if-no-files-found: warn
          compression-level: 0
