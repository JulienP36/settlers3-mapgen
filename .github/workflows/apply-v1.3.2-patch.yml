name: Apply v1.3.2 patch

on:
  push:
    branches:
      - fix/generator-editor-safety-v1.3.2

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/generator-editor-safety-v1.3.2
          fetch-depth: 0
      - name: Apply staged patch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f tools/v1_3_2.patch.gz.b64 ]; then
            echo "Patch payload already cleaned; nothing to do."
            exit 0
          fi
          base64 -d tools/v1_3_2.patch.gz.b64 | gzip -d > /tmp/v1.3.2.patch
          if ! git apply --check /tmp/v1.3.2.patch; then
            echo "Patch is already applied or no longer applies cleanly; leaving branch unchanged."
            exit 0
          fi
          git apply /tmp/v1.3.2.patch
          git config user.name "JulienP36"
          git config user.email "32819302+JulienP36@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden starts, snow accessibility and swamp transitions" -m "Developed with assistance from ChatGPT."
          git push origin HEAD:fix/generator-editor-safety-v1.3.2
