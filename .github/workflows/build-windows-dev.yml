name: Build Windows DEV candidate

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/build-windows-dev.yml'
      - 'build/windows/**'
      - 'config/**'
      - 'data/**'
      - 'references/SETTLERS3_PLAYER_START_MARKERS_J1_J20_REFERENCE_20260822.png'
      - 'requirements.txt'
      - 'run_gui.py'
      - 's3mapgen/**'
      - 'tests/**'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r build/windows/requirements-build.txt pytest
      - name: Protected baseline hashes
        shell: powershell
        run: .\build\windows\verify_protected_hashes.ps1
      - name: Regression tests
        run: python -m pytest -q
      - name: Engine smoke validation
        run: python tests/run_smoke.py
      - name: Build and validate standalone folder
        shell: powershell
        run: .\build\windows\build_windows.ps1
      - name: Upload Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: Settlers3MapGen-Windows-DEV-candidate
          path: |
            artifacts/SETTLERS3_MAPGEN_*_WINDOWS_X64.zip
            artifacts/SETTLERS3_MAPGEN_*_WINDOWS_X64.zip.sha256
            artifacts/SETTLERS3_MAPGEN_*_WINDOWS_X64_SELFTEST.json
          if-no-files-found: error
          compression-level: 0
