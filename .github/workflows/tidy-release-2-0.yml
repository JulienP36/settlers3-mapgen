name: Clean release 2.0 downloads
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/tidy-release-2-0.yml']
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            if (owner !== 'JulienP36' || repo !== 'settlers3-mapgen' || context.ref !== 'refs/heads/dev') {
              throw new Error('Unexpected repository or branch');
            }
            const release = (await github.rest.repos.getReleaseByTag({owner, repo, tag: 'v2.0'})).data;
            if (release.id !== 430325071 || release.draft) throw new Error('Unexpected release');
            const keep = new Map([
              ['SETTLERS3_MAPGEN_V2_0_STABLE_SOURCES.zip', 'sha256:c129a46457025e9c040b7686e950f6bd35480fcbdf9a80c744000a6013fcbd57'],
              ['SETTLERS3_MAPGEN_V2_0_STABLE_WINDOWS_X64.zip', 'sha256:6f9e7461fde92123e4a01d5e038c4515f59b1bc8187a916a510f92fe58b9caad']
            ]);
            const remove = new Map([
              ['SETTLERS3_MAPGEN_V2_0_STABLE_SOURCES.zip.sha256', 697140682],
              ['SETTLERS3_MAPGEN_V2_0_STABLE_WINDOWS_X64.zip.sha256', 697140680],
              ['SETTLERS3_MAPGEN_V2_0_STABLE_WINDOWS_X64_QUALIFICATION.json', 697140696],
              ['SETTLERS3_MAPGEN_V2_0_STABLE_WINDOWS_X64_SELFTEST.json', 697140679]
            ]);
            const before = (await github.rest.repos.listReleaseAssets({owner, repo, release_id: release.id, per_page: 100})).data;
            for (const [name, digest] of keep) {
              const asset = before.find(a => a.name === name);
              if (!asset || asset.digest !== digest) throw new Error('ZIP changed: ' + name);
            }
            for (const asset of before) {
              if (!remove.has(asset.name)) continue;
              if (remove.get(asset.name) !== asset.id) throw new Error('Asset identity changed');
              await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id: asset.id});
              core.info('Removed ' + asset.name);
            }
            const body = (release.body || '')
              .replace('les rapports SELFTEST/QUALIFICATION et les empreintes accompagnent les ZIP.', 'les empreintes des ZIP sont affichées par GitHub.')
              .replace('qualified on Windows from the release commit; checksums and reports are included.', 'qualified on Windows from the release commit; ZIP checksums are displayed by GitHub.')
              .replace(/\n\n## SHA-256\n[\s\S]*$/, '');
            if (body !== release.body) await github.rest.repos.updateRelease({owner, repo, release_id: release.id, body});
            const after = (await github.rest.repos.listReleaseAssets({owner, repo, release_id: release.id, per_page: 100})).data;
            if (after.length !== 2 || after.some(a => keep.get(a.name) !== a.digest)) {
              throw new Error('Final assets differ from the two original ZIPs');
            }
            core.info('Verified: only the two unchanged ZIPs remain.');
            const path = '.github/workflows/tidy-release-2-0.yml';
            const original = (await github.rest.repos.getContent({owner, repo, path, ref: context.sha})).data;
            let current;
            try { current = (await github.rest.repos.getContent({owner, repo, path, ref: 'dev'})).data; }
            catch (error) { if (error.status !== 404) throw error; }
            if (current && current.sha === original.sha) {
              await github.rest.repos.deleteFile({
                owner, repo, path, sha: current.sha, branch: 'dev',
                message: 'Retirer la tâche ponctuelle de nettoyage [skip ci]'
              });
              core.info('Temporary workflow removed.');
            }
