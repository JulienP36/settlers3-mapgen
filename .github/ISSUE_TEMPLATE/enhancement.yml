name: Enhancement
description: Suggest a concrete improvement that should be tracked.
title: "[Enhancement] "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: Need or problem
      description: One sentence is enough to quickly save the idea from a phone.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Optional when the idea still needs further discussion.
  - type: textarea
    id: validation
    attributes:
      label: Expected outcome
      description: How will we know that the improvement addresses the need?
