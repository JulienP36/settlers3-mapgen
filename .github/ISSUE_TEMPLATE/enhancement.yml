name: Amélioration
description: Proposer une amélioration suffisamment concrète pour être suivie.
title: "[Amélioration] "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: Besoin ou problème rencontré
      description: Une phrase suffit pour enregistrer rapidement l’idée depuis un téléphone.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Comportement proposé
      description: Facultatif si l’idée doit encore être précisée ensemble.
  - type: textarea
    id: validation
    attributes:
      label: Résultat attendu
      description: Comment saurons-nous que l’amélioration répond au besoin ?
