name: Bug
description: Report incorrect behavior or a reproducible crash.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Tested version or candidate, if known.
      placeholder: "Example: v1.8 DEV_8_R1"
  - type: textarea
    id: problem
    attributes:
      label: Observed problem
      description: Briefly describe what happened and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: A numbered list is ideal, but a quick note can be completed later.
      placeholder: "1. Open…\n2. Click…\n3. Observe…"
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Relevant file, seed, screenshot, traceback, theme, language, or other useful information.
