name: Technical investigation
description: Track a technical question or a bounded analysis for later.
title: "[Investigation] "
labels: ["investigation"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question to resolve
    validations:
      required: true
  - type: textarea
    id: known
    attributes:
      label: Known information
      description: Existing observations, files, hypotheses, or experiments.
  - type: textarea
    id: decision
    attributes:
      label: Expected decision
      description: What this investigation should help decide or validate.
