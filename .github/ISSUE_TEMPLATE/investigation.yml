name: Investigation technique
description: Conserver une question technique ou une analyse bornée à effectuer plus tard.
title: "[Investigation] "
labels: ["investigation"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question à résoudre
    validations:
      required: true
  - type: textarea
    id: known
    attributes:
      label: Éléments déjà connus
      description: Observations, fichiers, hypothèses ou expériences déjà réalisées.
  - type: textarea
    id: decision
    attributes:
      label: Décision attendue
      description: Ce que cette investigation doit permettre de choisir ou de valider.
